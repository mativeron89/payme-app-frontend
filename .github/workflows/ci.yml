# CI simple (regla dura #7): typecheck + build. Verde o no pasó.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 2026-08-06: dos veces seguidas un push y un PR llegaron al servidor sin que
  # Actions creara ningún run. Sin disparo manual no hay forma de pedir la
  # verificación de un commit ya pusheado, y la única salida es ensuciar la
  # historia con un commit vacío. El riesgo no es el hueco puntual: es que
  # "la rama está verde" pasa a significar "el último run que corrió salió
  # bien" en vez de "el último commit está verificado". Se parecen y no son
  # lo mismo.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El scanner compara contra el SHA anterior del push o la base del
          # PR. Un checkout shallow puede volver esa base inalcanzable y hacer
          # que el instrumento no mida nada.
          fetch-depth: 0
      - name: Auditar secretos del cambio
        run: bash scripts/auditar-secretos.sh "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # El gate del espejo, ANTES que las suites: si el contrato copiado no es
      # el que el dueño declara, nada de lo que sigue mide contra el contrato
      # real. Sale ≠0 ante archivo distinto, faltante, intruso, total
      # mentiroso o inventario ausente.
      #
      # 🔴 SE LLAMA "INTEGRIDAD LOCAL" Y NO "PARIDAD", a propósito (R3-A): acá
      # no existe `../payme-app-backend`, así que sólo se puede acreditar que
      # el espejo es fiel al INVENTARIO del dueño — no que el inventario
      # describa al backend. La ausencia de fuente NO puede producir un verde
      # de paridad; la paridad se corre en local, donde el repo hermano está.
      - name: Integridad local del contract-mirror (NO es paridad)
        run: node scripts/verificar-mirror.mjs --integridad
      # 🔴 EL ALIAS NO ES SU HERRAMIENTA (P88). Los gates de abajo se escriben
      # `npm test`, `npm run typecheck`, `npm run build`, pero lo que esos
      # comandos EJECUTAN vive en `package.json` y en las configs de los
      # runners. Con `scripts.test: "true"` el paso sale 0 sin lanzar Vitest;
      # excluyendo `scripts/**` de la config sale verde recolectando 84 archivos
      # en vez de 96. En los dos casos el texto del workflow queda intacto.
      #
      # 🔴 SE INVOCA CON `node` A PROPÓSITO, no con un alias npm: una guarda que
      # corre BAJO `npm test` no puede detectar que `npm test` sea un no-op —si
      # lo es, la guarda no corre y su silencio se lee como verde—.
      - name: El alias ejecuta su herramienta, sobre la población real
        run: node scripts/verificar-aliases.mjs --aliases
      # 🔴 SE BORRA EL REPORTE ANTES DE LA SUITE (P94). Antes acá había un sello
      # y `--corrida` comparaba `mtime`; pero `mtime` lo mueve cualquiera con
      # acceso al filesystem, así que se estaba midiendo con un instrumento
      # manipulable — el mismo error que el gate existe para evitar. Ahora la
      # AUSENCIA es la prueba: si la suite no corre, no hay reporte que mirar.
      - name: Invalidar el reporte anterior de la suite
        run: node scripts/verificar-aliases.mjs --invalidar corrida
      - run: npm test
      # 🔴 Y DESPUÉS SE MIRA QUÉ CORRIÓ DE VERDAD (P90). El paso de arriba mira
      # el mundo ANTES de que las herramientas corran, y eso es un TOCTOU por
      # construcción: npm ejecuta los hooks `pre*` ENTRE la aprobación y la
      # herramienta. Un `pretest` que recorta la config deja `npm test` en 0 con
      # 84 archivos y 1084 tests. Esto lee el reporte que la corrida escribió y
      # exige que haya ejecutado todo lo que existe en disco.
      - name: La suite ejecutó la población entera, medido sobre su reporte
        run: node scripts/verificar-aliases.mjs --corrida
      - run: npm run typecheck
      # 🔴 `VITE_API_URL` va acá desde 0.100.0, y NO es configuración de
      # despliegue: este `build` es una COMPUERTA DE COMPILACIÓN, no el
      # artefacto que se publica —eso lo construye Vercel con su propia
      # variable—. Sin la variable el build ahora FALLA a propósito
      # (`exigirApiUrl` en `vite.config.ts`), y sin este `env` la compuerta
      # caería en rojo sin que hubiera nada roto.
      #
      # ⚠️ El valor es una URL pública, no un secreto —lo tenía en claro también
      # el retirado `deploy-demo.yml`—. Y lo que se compila acá NO llega a
      # producción: si alguien lee esta línea buscando "a qué backend apunta la
      # app publicada", la respuesta está en Vercel, no en este archivo.
      # Y `dist` se borra antes del build, por lo mismo: un `touch` sobre un
      # artefacto viejo lo hacía pasar como recién escrito. Borrado, existir es
      # la acreditación.
      - name: Invalidar el artefacto anterior
        run: node scripts/verificar-aliases.mjs --invalidar build
      - run: npm run build
        env:
          VITE_API_URL: https://payme-app-backend-production.up.railway.app
      # 🔴 Y EL BUILD SE ACREDITA POR SU ARTEFACTO, no por su exit code: un alias
      # no-op sale 0 y no deja nada. Se mide lo que quedó en disco, y se exige que
      # sea POSTERIOR al sello: `prebuild` podía fijar `build.write=false` y dejar
      # que el gate aprobara el `dist` del build anterior.
      - name: El build dejó artefacto, no sólo un exit 0
        run: node scripts/verificar-aliases.mjs --artefacto dist
      # Los 78 recorridos de navegador también son gate: la auditoría del
      # 2026-08-06 encontró en ellos lo que ninguna suite sin navegador vio
      # (el Shell pisando la pantalla de rechazo, la coma ×100 en el input).
      # Sólo chromium: es el proyecto único de playwright.config.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      # 🔴 Se lee el resultado en un paso APARTE, y el de arriba queda intacto.
      # Ese `run:` es el que gatea la publicación: un pipe para capturar su
      # salida le comería el exit code (el shell por defecto es `bash -e`, SIN
      # `pipefail`) y la compuerta quedaría abierta en silencio.
      #
      # `if: always()` porque un flaky puede convivir con una corrida roja, y
      # ahí también hay que verlo. El script NUNCA sale ≠0: informa, no bloquea.
      - name: Reportar flaky de Playwright (informa, NO bloquea)
        if: always()
        run: bash scripts/reportar-flaky.sh test-results/resultados.json

      # ══════════════════════════════════════════════════════════════════
      # 🔴 LA COMPUERTA DE PUBLICACIÓN · 2026-08-10
      #
      # Hasta hoy Vercel publicaba solo en cada push, en PARALELO con esto.
      # Medido en `a79c6a3`: producción quedó viva a las 06:03:01 y este job
      # terminó 06:05:56 — dos minutos 55 DESPUÉS. Si la suite se ponía roja,
      # Pages se plantaba y Vercel publicaba igual: el único gate que había
      # protegía la copia que nadie visita.
      #
      # Ahora `vercel.json` apaga el despliegue automático de `main` y la
      # publicación pasa por acá. El porqué completo, y qué NO cubre, en
      # `docs/DESPLIEGUE_GATEADO.md`.
      #
      # ⚠️ El `success()` va EXPLÍCITO. Actions lo aplica implícito cuando hay
      # un `if:` sin función de estado, pero la regla no debería depender de
      # que quien lea esto conozca esa sutileza.
      #
      # 🔴 DESDE 0.102.0 ÉSTE ES EL ÚNICO CAMINO DE PUBLICACIÓN. Acá decía que
      # `deploy-demo.yml` publicaba «SIN gate» dentro de una ventana de gracia.
      # **Las dos mitades eran falsas y las propagué**: ese workflow SÍ tenía
      # compuerta —la de la secuencia: un paso en rojo aborta el job— y su
      # propio comentario ya lo había corregido. Lo que tenía era una compuerta
      # MÁS DÉBIL (sin Playwright ni integridad del espejo), que es peor y es
      # otra cosa. Se retiró por eso, no por lo que este comentario decía.
      # ══════════════════════════════════════════════════════════════════
      - name: Publicar en Vercel (sólo con TODO en verde)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          bash scripts/publicar-vercel.sh app "$HOOK_APP"
          bash scripts/publicar-vercel.sh landing "$HOOK_LANDING"
        env:
          HOOK_APP: ${{ secrets.VERCEL_HOOK_APP }}
          HOOK_LANDING: ${{ secrets.VERCEL_HOOK_LANDING }}
