# Publica TRES builds del front en GitHub Pages en cada push a main:
#   /              → demo MOCK (para feedback de diseño, sin backend)
#   /live/         → real, contra el backend vivo de Railway (para el video YC)
#   /landing/      → la landing (paso 3, abajo)
# La URL queda en https://mativeron89.github.io/payme-app-frontend/
#                  y https://mativeron89.github.io/payme-app-frontend/live/
#
# 🔴 ESTE ARCHIVO NO ES EL MAPA COMPLETO DE LO PUBLICADO · 2026-08-10.
# Decía «DOS builds» cuando ya eran tres, y sigue sin poder describir lo que
# más importa: los dominios propios NO salen de acá.
#
#   paymemx.com · www.paymemx.com   → los sirve VERCEL, desde fuera de este repo
#   app.paymemx.com                 → los sirve VERCEL, desde fuera de este repo
#   panel.paymemx.com               → es de `payme-dashboard-frontend`
#
# En el repo no hay `vercel.json`, ni `CNAME`, ni un secreto ni un paso que
# mencione ese despliegue: **el artefacto que ve el público se publica por un
# camino que este repo no describe, no reproduce y no verifica.** Queda
# registrado acá porque es donde alguien lo va a buscar.
#
# 🔴 Y DE AHÍ SALE ALGO PEOR, MEDIDO EN EL COMMIT `a79c6a3`:
#
#     push                            06:01:05Z
#     este workflow termina           06:02:53Z
#     ápice publicado por Vercel      06:03:01Z   ← producción VIVA
#     CI (vitest+typecheck+e2e)       06:05:56Z   ← 2 m 55 s DESPUÉS
#
# Más abajo este archivo dice, textual, que «Pages no publica un artefacto cuyo
# comportamiento no pasó la suite». Es cierto **y protege la copia que nadie
# visita**: si la suite se pone roja, Pages se planta en el commit anterior y
# **Vercel publica igual**.
#
# **El gate estaba al revés.** El que quedaba viejo era el verificado; el que
# salía a producción era el que ningún gate nuestro frenó.
#
# ✅ CORREGIDO EL MISMO DÍA. Mati autorizó gatear el despliegue: `vercel.json`
# apaga el automático de `main` y `ci.yml` llama a los Deploy Hooks al final,
# sólo con todo en verde. El porqué en `docs/DESPLIEGUE_GATEADO.md`.
#
# 🔴 PERO ESTE WORKFLOW SIGUE SIN COMPUERTA, y hay que saberlo:
#
#     paymemx.com · app. · panel.   →  ci.yml, DESPUÉS de la suite   ✅ gateado
#     …github.io/payme-app-frontend →  este archivo, en cada push    🔴 sin gate
#
# O sea: **la copia de Pages puede quedar publicada desde un commit cuya suite
# falló.** No es producción —nadie la visita— pero está viva y es pública.
# No se toca hoy: está en su ventana de gracia de siete días, y cuando cierre
# este workflow se retira por orden propia. Que quede escrito para que nadie
# descubra la asimetría por accidente.
# Requiere una vez: Settings → Pages → Source: "GitHub Actions".
#
# El build /live/ apunta al backend real (VITE_MOCK=0). La publishable key de
# Stripe la sirve el backend en GET /api/config, así que NO va como variable acá.
# VITE_RESTAURANT_ID es el uuid del restaurante demo, usado como FALLBACK
# cuando la URL no trae el QR (?r=uuid). Nombre/dirección se resuelven en vivo
# contra GET /api/restaurants/:id (G-01 resuelto en backend v2.21).
name: Deploy demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Pages no publica un artefacto cuyo comportamiento no pasó la suite.
      - run: npm test
      - run: npm run typecheck

      # 1) Build MOCK primero (a dist/ raíz).
      - run: npm run build -- --base=/payme-app-frontend/
        env:
          VITE_MOCK: '1'

      # 2) Build REAL a dist/live/ (no toca los archivos de dist/ raíz).
      - run: npm run build -- --base=/payme-app-frontend/live/ --outDir dist/live
        env:
          VITE_MOCK: '0'
          VITE_API_URL: https://payme-app-backend-production.up.railway.app
          # La Parolaccia en el backend vivo — fallback sin QR. El nombre ya
          # NO se hardcodea: lo resuelve GET /api/restaurants/:id (G-01, v2.21).
          VITE_RESTAURANT_ID: 00000000-0000-4000-8000-000000000001

      # 3) La LANDING, a dist/landing/.
      #
      # ⚠️ ESTO SIGUE SIENDO UNA PREVIEW, NO LA ARQUITECTURA RATIFICADA:
      # publicar bajo un prefijo de Pages no es `D-WEB-1-BIS`.
      #
      # 🔴 PERO SU MOTIVO CAMBIÓ · 2026-08-10. Acá decía «esas compuertas
      # siguen cerradas: no hay DNS ni hosting», y que la entrada se retiraba
      # «cuando exista el dominio». **Los tres orígenes están vivos y el ápice
      # sirve esta misma landing** (medido: 200 sin redirect, CSS byte-idéntico
      # al de `dist-landing/`). La condición se cumplió.
      #
      # NO se retira el paso, y la razón no es inercia: hoy esta copia es la
      # ÚNICA publicación de la landing que sale de este repo y que el CI puede
      # verificar. Retirarla dejaría el artefacto público sin ningún gate
      # nuestro encima. Queda como espejo secundario, declarado.
      #
      # ⚠️ Lo que este paso NO puede hacer: garantizar que el ápice sirva lo
      # mismo. Son dos tuberías distintas. Hoy coinciden porque lo comparé a
      # mano una vez; nada lo vuelve a comprobar. Que el ápice quede servido de
      # una versión vieja es un riesgo real y sin dueño.
      #
      # No lleva `--base`: `vite.landing.config.ts` ya usa `base: './'`, que
      # anda en la raíz de un dominio Y bajo cualquier prefijo. Una bandera acá
      # dependería de que alguien se acuerde y de que el prefijo no cambie.
      - run: npm run build:landing
      - run: cp -R dist-landing dist/landing
      # Que no se publique un artefacto vacío o a medio construir sin avisar.
      - name: Verificar que la landing salió entera
        run: |
          test -f dist/landing/index.html
          grep -q './assets/' dist/landing/index.html
          test -n "$(find dist/landing -name '*.ttf' -print -quit)"
          test -f dist/landing/fonts/OFL-PlusJakartaSans.txt
          echo "landing OK: html + assets relativos + tipografía + licencia"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
