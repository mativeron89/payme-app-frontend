         para 16-32px y ésa es la diferencia entre los dos archivos.
         Copia local: el artefacto no toma nada de la red (D-FUENTES-1 sacó las
         tres etiquetas a Google y no vuelven). Sin `<text>`, así que no depende

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Dark A de instalación PWA (AF-PWA-INSTALLABILITY-DARK-A-01): manifest
         same-origin e iconos locales. Desde B2 (0.166.0, AF-15) SÍ hay un
         service worker, pero sólo cachea estáticos versionados: los archivos
         de `/assets/` con hash en el nombre y los íconos de `/pwa/`. Este
         `index.html`, toda navegación y la API van SIEMPRE por red; las
         respuestas privadas siguen `no-store`, y sigue SIN haber modo offline.
         No se registra desde este HTML sino desde `src/main.tsx`; qué hace y
         cómo se retira: la cabecera de `src/sw/serviceWorker.js` (`RETIRAR`).
         El apple-touch-icon es full-bleed opaco porque iOS aplica su propia
         máscara; el maskable del manifest lleva el tile dentro de la safe zone.
         La guarda estructural vive en `scripts/pwaInstallability.test.ts`. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/icon-180.png" />
    <!-- PWA B1 (AF-PWA-INSTALLABILITY-STAGE-B-01, sub-orden B1, 2026-09-18):
         tres metadatos que iOS lee para "Agregar a inicio" desde el Share
         sheet de Safari, que el manifest solo no le alcanza a cubrir de forma
         confiable en todas las versiones. Son sólo metadatos: el service
         worker de B2 no se registra desde acá (ver el comentario de arriba).
         `apple-mobile-web-app-title` repite el `short_name` del manifest
         ("PayMe"), nunca un nombre distinto. `status-bar-style` es
         `black-translucent` porque el viewport ya declara `viewport-fit=cover`
         arriba: la app ya está pensada para pintar bajo el notch/status bar,
         así que el valor consistente con eso es dejar la barra translúcida,
         no taparla con negro sólido. No se verifica visualmente sin un iPhone
         real — ver INVENTARIO_PWA.md, riesgo #3. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PayMe" />

    <!-- Las tipografías se sirven desde este repo. Acá había tres etiquetas a
         Google (dos preconnect y una hoja de estilos): se retiraron en
         `D-FUENTES-1` y NO se vuelven a poner. El `@font-face` vive en
         `src/styles/global.css`, junto al resto del sistema. -->
    <style>
      /* Splash de carga · D292 (Mati, 2026-10-12, «Siempre al abrir
         (Recomendada)», con la adenda 2 «Aumenta a dos segundos el icono de
         carga inicial»): aparece en cada apertura o recarga, también por un
         link o un QR de mesa, desde el primer cuadro, y queda al menos 4 s
         (D498, Mati: «dejala dos segundos mas luego»; antes 2 s).
         D300: los 4 s se cuentan desde el primer cuadro pintado, no desde que
         empezó la navegación (lo cuenta `src/splash.ts`). Reemplaza «B sólo
         cuando tarda» (2026-08-19), que lo mostraba sólo si la app tardaba
         más de 300 ms.

         Vive acá, inline, a propósito: es lo ÚNICO que pinta ANTES de que
         cargue el grafo de módulos — si viviera en global.css llegaría junto
         con la app y ya no tendría a quién tapar.

         Los tiempos (espejados en `src/splash.ts`, y hay un test que impide que
         las dos copias se separen):
         · se ve desde el primer cuadro: sin retardo y sin fundido de entrada
           del `#splash`;
         · D476 (opción A, «lo que se armó con Claude Design»; enmienda D300
           punto 3): la palabra entra con un fundido mientras sube 16 px. D491:
           a los 300 ms y durante 1200 ms. Con «reducir movimiento», entera desde el
           primer cuadro. La imagen de arranque del iPhone va sin la palabra,
           así que no parpadea: aparece una sola vez;
         · 12 s de rendición — si el grafo de módulos muere (ya pasó:
           ERR_NETWORK_CHANGED, 2026-08-10), el splash se retira solo en vez
           de quedar eterno tapando una app muerta con cara de viva. Vuelve
           al blanco de hoy, que es feo pero no miente.

         D475 · lo que se ve, según `PANTALLA-pantalla-de-carga.md` (4ef1274b…,
         «PayMe entre dos puntas», 7a), que manda: fondo navy, dos puntas teal →
         cian en esquinas opuestas de la zona debajo de la barra de estado y la
         palabra «PayMe» en contornos en el centro. Reemplaza los cuatro
         triángulos metálicos y el ícono navy de D286 (revisión 6); D330 queda
         sin objeto. Sin imágenes, sin tipografías, sin texto. */
      /* D498 · la barra blanca de abajo. La app de inicio de iOS arranca con el
         viewport corto (793 de 852 pt, medido en D179): lo que queda debajo,
         59 pt, no es del `#splash` sino el fondo de la página, que era claro.
         Medido en el video de Mati sobre 0.264.2: 59,0 pt, de 1,20 a 1,35 s.
         Mientras exista el `#splash`, el fondo de la página es su mismo navy;
         cuando la app lo saca del árbol, vuelve el de siempre. */
      html:has(> body > #splash) {
        background: #101e3b;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #101e3b;
        animation: splash-rendirse 400ms ease 12s forwards;
      }
      /* D498 · 2 (0.264.4) · lo que asomaba en esos 59 pt sobre 0.264.3 ya no era
         el fondo sino la barra de pestañas de la app (video de Mati, 2 o 3
         cuadros por ingreso): `.app` mide `100lvh` (852) y el `#splash`, fijo con
         `inset: 0`, sólo el viewport corto (793). En la app instalada el `#splash`
         mide lo mismo que `.app`. Va `absolute` y no `fixed` a propósito: en
         0.210.5 una capa fija estirada a 852 se pintó sólo hasta 793 en el
         iPhone, y `.app`, en el flujo, se pinta hasta 852 (es lo que se ve en el
         video). Dos condiciones: `display-mode` vale antes de que cargue el JS;
         la clase de `src/appDeInicio.ts` es la misma que estira `.app`. En
         Safari no aplica: ahí `100lvh` taparía la punta de abajo con su barra. */
      @media (display-mode: standalone) {
        #splash {
          position: absolute;
          bottom: auto;
          height: 100vh;
          height: 100lvh;
        }
      }
      html.app-de-inicio-ios #splash {
        position: absolute;
        bottom: auto;
        height: 100vh;
        height: 100lvh;
      }
      /* La franja de la barra de estado: con la app instalada, la hora y la
         batería van en blanco encima (`black-translucent` y `viewport-fit=cover`
         ya están arriba). En el navegador mide 0. D476 (enmienda D353): navy
         lisa, fundida con el fondo; la punta de arriba empieza debajo de ella. */
      #splash .carga__franja {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: env(safe-area-inset-top);
        background: #101e3b;
      }
      #splash .carga__zona {
        position: absolute;
        top: env(safe-area-inset-top);
        left: 0;
        right: 0;
        bottom: 0;
      }
      /* Cada punta es la zona entera recortada: el degradé se calcula sobre el
         rectángulo de la zona, no sobre el triángulo (con estos valores el cian
         llega justo al corte). No se animan. */
      #splash .carga__punta {
        position: absolute;
        inset: 0;
      }
      #splash .carga__punta--arriba {
        clip-path: polygon(0 0, 56% 0, 0 19.2%);
        background: linear-gradient(135deg, #0a7b80 0%, #0fb5c9 17.1%);
      }
      #splash .carga__punta--abajo {
        clip-path: polygon(100% 100%, 44% 100%, 100% 80.8%);
        background: linear-gradient(315deg, #0a7b80 0%, #0fb5c9 17.1%);
      }
      /* La palabra: 126 × 40 fijo (igual de 375 a 430), centrada en la zona. La
         animación va en el `<svg>`, no acá: así el `translate(-50%, -50%)` del
         centrado y el `translateY` de la entrada no se pisan. */
      #splash .carga__palabra {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 126px;
        height: 40px;
        transform: translate(-50%, -50%);
      }
      #splash .carga__palabra svg {
        display: block;
        width: 126px;
        height: 40px;
        opacity: 1;
      }
      @media (prefers-reduced-motion: no-preference) {
        #splash .carga__palabra svg {
          animation: carga-palabra 1200ms cubic-bezier(.4, 0, .2, 1) 300ms both;
        }
      }
      /* 🔴 Nace en 0.001, no en 0 como la especificación (R1 del informe D475):
         a la vista es igual, pero con 0 el navegador no anota
         `first-contentful-paint` en el primer cuadro (las puntas son degradés,
         no cuentan como contenido) y `src/splash.ts` contaría los 4 s de D300
         desde que monta la app, no desde que se ve. */
      @keyframes carga-palabra {
        from { opacity: 0.001; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-rendirse {
        to { opacity: 0; visibility: hidden; }
      }
    </style>
  </head>

    <div id="root"></div>
    <!-- D475 · la pantalla de carga de `PANTALLA-pantalla-de-carga.md` (7a):
         la franja de la barra de estado, las dos puntas y la palabra «PayMe» en

         request. La lógica de aparición y retiro (`src/splash.ts`) no conoce lo

         pantalla no gana nada anunciándolo (por eso no lleva el
         `role="status"` que propone el paquete). -->

      <div class="carga__zona">
        <div class="carga__punta carga__punta--arriba"></div>
        <div class="carga__punta carga__punta--abajo"></div>
