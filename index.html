<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101E3B" />
    <title>PayMe</title>
    <!-- 🔴 A2 · el símbolo nuevo, ratificado 2026-08-14 («Sí, adoptarlo»).
         Es `favicon.svg` del handoff, NO el símbolo escalado: está re-centrado
         para 16-32px y ésa es la diferencia entre los dos archivos.
         Copia local: el artefacto no toma nada de la red (D-FUENTES-1 sacó las
         tres etiquetas a Google y no vuelven). Sin `<text>`, así que no depende
         de ninguna tipografía. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Dark A de instalación PWA (AF-PWA-INSTALLABILITY-DARK-A-01): manifest
         same-origin e iconos locales. Desde B2 (0.166.0, AF-15) SÍ hay un
         service worker, pero sólo cachea estáticos versionados: los archivos
         de `/assets/` con hash en el nombre y los íconos de `/pwa/`. Este
         `index.html`, toda navegación y la API van SIEMPRE por red; las
         respuestas privadas siguen `no-store`, y sigue SIN haber modo offline.
         No se registra desde este HTML sino desde `src/main.tsx`; qué hace y
         cómo se retira: `docs/SERVICE_WORKER.md`.
         El apple-touch-icon es full-bleed opaco porque iOS aplica su propia
         máscara; el maskable del manifest lleva el tile dentro de la safe zone.
         La guarda estructural vive en `scripts/pwaInstallability.test.ts`. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/icon-180.png" />
    <!-- PWA B1 (AF-PWA-INSTALLABILITY-STAGE-B-01, sub-orden B1, 2026-09-18):
         tres metadatos que iOS lee para "Agregar a inicio" desde el Share
         sheet de Safari, que el manifest solo no le alcanza a cubrir de forma
         confiable en todas las versiones. Son sólo metadatos: el service
         worker de B2 no se registra desde acá (ver el comentario de arriba).
         `apple-mobile-web-app-title` repite el `short_name` del manifest
         ("PayMe"), nunca un nombre distinto. `status-bar-style` es
         `black-translucent` porque el viewport ya declara `viewport-fit=cover`
         arriba: la app ya está pensada para pintar bajo el notch/status bar,
         así que el valor consistente con eso es dejar la barra translúcida,
         no taparla con negro sólido. No se verifica visualmente sin un iPhone
         real — ver INVENTARIO_PWA.md, riesgo #3. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PayMe" />
    <!-- D300 · las imágenes de arranque del iPhone: con la app instalada, iOS
         muestra la que coincide con el tamaño del teléfono hasta que la página
         pinta. Sin ellas, la apertura se veía en negro antes de la pantalla de
         carga. Cada una ES la pantalla de carga de abajo (D286), dibujada por
         `scripts/imagenes-de-arranque.mjs` desde este archivo, con la franja de
         la barra de estado de ese iPhone: del arranque a la página no cambia
         nada. Una por tamaño, en vertical. La guarda vive en
         `src/arranque/imagenesDeArranque.test.ts`. -->
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/arranque/arranque-750x1334.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/arranque/arranque-828x1792.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1125x2436.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1242x2688.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1206x2622.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1320x2868.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/arranque/arranque-1260x2736.png" />
    <!-- Las tipografías se sirven desde este repo. Acá había tres etiquetas a
         Google (dos preconnect y una hoja de estilos): se retiraron en
         `D-FUENTES-1` y NO se vuelven a poner. El `@font-face` vive en
         `src/styles/global.css`, junto al resto del sistema. -->
    <style>
      /* Splash de carga · D292 (Mati, 2026-10-12, «Siempre al abrir
         (Recomendada)», con la adenda 2 «Aumenta a dos segundos el icono de
         carga inicial»): aparece en cada apertura o recarga, también por un
         link o un QR de mesa, desde el primer cuadro, y queda al menos 2 s.
         D300: los 2 s se cuentan desde el primer cuadro pintado, no desde que
         empezó la navegación (lo cuenta `src/splash.ts`). Reemplaza «B sólo
         cuando tarda» (2026-08-19), que lo mostraba sólo si la app tardaba
         más de 300 ms.

         Vive acá, inline, a propósito: es lo ÚNICO que pinta ANTES de que
         cargue el grafo de módulos — si viviera en global.css llegaría junto
         con la app y ya no tendría a quién tapar.

         Los tiempos (espejados en `src/splash.ts`, y hay un test que impide que
         las dos copias se separen):
         · se ve desde el primer cuadro: sin retardo y sin fundido de entrada;
         · D300: el ícono, entero desde el primer cuadro (sin la entrada de
           240 ms que tenía), con o sin «reducir movimiento»;
         · 12 s de rendición — si el grafo de módulos muere (ya pasó:
           ERR_NETWORK_CHANGED, 2026-08-10), el splash se retira solo en vez
           de quedar eterno tapando una app muerta con cara de viva. Vuelve
           al blanco de hoy, que es feo pero no miente.

         D286 (revisión 6, aprobada) · lo que se ve, según
         `PANTALLA-pantalla-de-carga.md` (d03f38b4…), que manda: cuatro
         triángulos metálicos (D330: navy arriba, cian a la izquierda, teal a la
         derecha, celeste abajo) que se juntan en el centro de la zona debajo de
         la barra de estado, y el ícono navy de 128 px en el punto de
         encuentro. Sin imágenes, sin tipografías, sin texto. Los tonos de
         brillo y sombra son mezclas de la paleta, no tokens. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #101e3b;
        animation: splash-rendirse 400ms ease 12s forwards;
      }
      /* La franja de la barra de estado: con la app instalada, la hora y la
         batería van en blanco encima (`black-translucent` y `viewport-fit=cover`
         ya están arriba). En el navegador mide 0. */
      #splash .carga__franja {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: env(safe-area-inset-top);
        background: #101e3b;
      }
      #splash .carga__zona {
        position: absolute;
        top: env(safe-area-inset-top);
        left: 0;
        right: 0;
        bottom: 0;
      }
      /* Cada triángulo es la zona entera recortada: el degradé se calcula sobre
         el rectángulo de la zona, no sobre el triángulo. */
      #splash .t {
        position: absolute;
        inset: 0;
      }
      #splash .t-arriba {
        clip-path: polygon(0 0, 100% 0, 50% 50%);
        background: linear-gradient(80deg, #101e3b 0%, #3d4a63 30%, #101e3b 50%, #2c3954 72%, #101e3b 100%);
      }
      #splash .t-izq {
        clip-path: polygon(0 0, 50% 50%, 0 100%);
        background: linear-gradient(170deg, #a1dbe4 0%, #1493b1 30%, #82d0dc 52%, #0fb5c9 66%, #1b6b8f 100%);
      }
      #splash .t-der {
        clip-path: polygon(100% 0, 100% 100%, 50% 50%);
        background: linear-gradient(190deg, #016274 0%, #66a2a5 30%, #04596e 55%, #428e92 72%, #0d415d 100%);
      }
      #splash .t-abajo {
        clip-path: polygon(0 100%, 50% 50%, 100% 100%);
        background: linear-gradient(100deg, #abc7ce 0%, #ffffff 24%, #cfe8eb 42%, #f4fdfe 60%, #97b4be 100%);
      }
      /* El ícono: 128 × 128 fijo (igual de 375 a 430), centrado en el punto de
         encuentro. D300: aparece entero desde el primer cuadro, sin animación;
         es el mismo cuadro que las imágenes de arranque del iPhone
         (`public/arranque/`), así que del arranque a la página no cambia. */
      #splash .carga__icono {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 128px;
        height: 128px;
        transform: translate(-50%, -50%);
      }
      @keyframes splash-rendirse {
        to { opacity: 0; visibility: hidden; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- D286 (revisión 6) · la pantalla de carga de `PANTALLA-pantalla-de-carga.md`:
         la franja de la barra de estado, los cuatro triángulos y el ícono navy
         (flecha izquierda cian, derecha blanca), inline para que pinte sin
         ninguna request. La lógica de aparición y retiro (`src/splash.ts`) no
         conoce lo que se dibuja. `aria-hidden`: es decorativo y transitorio, un
         lector de pantalla no gana nada anunciándolo. -->
    <div id="splash" aria-hidden="true">
      <div class="carga__franja"></div>
      <div class="carga__zona">
        <div class="t t-arriba"></div>
        <div class="t t-izq"></div>
        <div class="t t-der"></div>
        <div class="t t-abajo"></div>
        <!-- El SVG de la sección 4 de la especificación, sin xmlns a propósito:
             inline en HTML el parser ya lo pone en el namespace SVG, y la URL del
             atributo (aunque jamás se pide por red) dispara la guarda de
             destinos — que tiene razón en no distinguir. -->
        <svg class="carga__icono" viewBox="0 0 128 128" role="img" aria-label="PayMe"><rect width="128" height="128" rx="36" fill="#101E3B"/><g transform="scale(1.6842)"><path fill="#0FB5C9" d="M18.5 21L27.5 21L36.5 38L27.5 55L18.5 55L27.5 38Z"/><path fill="#FFFFFF" d="M39.5 21L48.5 21L57.5 38L48.5 55L39.5 55L48.5 38Z"/></g></svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
