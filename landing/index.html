<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1f3d" />
    <title>PayMe</title>
    <link rel="stylesheet" href="./landing.css" />
  </head>
  <body>
    <main class="landing">
      <header class="landing-intro">
        <h1 class="landing-marca">PayMe</h1>
        <p class="landing-frase">
          Divide la cuenta del restaurante y paga tu parte desde tu teléfono.
        </p>
      </header>
      <div class="landing-muestras">
        <img
          class="landing-muestra landing-muestra-app"
          src="./img/app-dividir-cuenta.png"
          width="1125"
          height="2436"
          alt="Pantalla de PayMe en un teléfono: la mesa de La Parolaccia con su cuenta desglosada en platillos, dos ya pagados y uno tomado por otra persona."
        />
        <figure class="landing-figura">
          <img
            class="landing-muestra landing-muestra-panel"
            src="./img/panel-propinas.png"
            width="2880"
            height="1800"
            alt="Panel del restaurante: propinas por mesa y por mesero, con el total del turno."
          />
          <figcaption class="landing-pie">Datos de ejemplo — panel en modo demo</figcaption>
        </figure>
      </div>
      <nav class="landing-accesos" aria-label="Accesos a PayMe">
        <a class="landing-acceso" href="https://mativeron89.github.io/payme-app-frontend/">Comensal</a>
        <p class="landing-acceso landing-acceso-pronto">Restaurante <span>Muy pronto</span></p>
      </nav>
    </main>
  </body>
</html>
